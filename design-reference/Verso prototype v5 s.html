/* Live refresh after an edit: node card, connections, status chip and previews update without re-rendering the panel */
function wfLive(n) {
  wfDrawNodes(); wfDrawEdges();
  const st = document.getElementById('wfStatusVal'); if (st) st.innerHTML = wfStatusHTML(n.status);
  const sumEl = document.getElementById('wfSumVal'); if (sumEl) { const m = wfMissing(n); sumEl.textContent = m.length ? `Set ${m[0].l.toLowerCase()}` : wfType(n).sum(n.config); sumEl.classList.toggle('missing', !!m.length); }
  const cn = document.getElementById('wfConn'); if (cn) cn.innerHTML = wfConnHTML(n);
  const ed = WF_EDITORS[n.type], pv = document.getElementById('wfPreview');
  if (ed && ed.preview && pv) pv.innerHTML = ed.preview(n);
  icons();
}

/* ---------- Validation & test run ---------- */
function wfReachable() {
  const seen = new Set(), q = WF.nodes.filter(n => wfType(n).cat === 'input').map(n => n.id);
  while (q.length) { const id = q.shift(); if (seen.has(id)) continue; seen.add(id); WF.edges.filter(e => e.from === id).forEach(e => q.push(e.to)); }
  return seen;
}
function wfValidate() {
  wfRefreshStatus();
  const issues = [];
  const inputs = WF.nodes.filter(n => wfType(n).cat === 'input');
  if (!inputs.length) issues.push({ lvl:'err', msg:'Add an input step, such as API / webhook, so the workflow knows when to start.' });
  const reach = wfReachable();
  WF.nodes.forEach(n => {
    const t = wfType(n), miss = wfMissing(n);
    if (miss.length) issues.push({ lvl:'err', node:n.id, msg:`${n.title}: set ${miss.map(f => f.l.toLowerCase()).join(', ')}.` });
    wfIns(n).forEach(p => { if (!WF.edges.some(e => e.to === n.id && e.toPort === p)) issues.push({ lvl:'err', node:n.id, msg:wfIns(n).length > 1 ? `${n.title}: nothing is connected to the “${p}” input.` : `${n.title} has no incoming connection, so it will never run.` }); });
    if (t.cat !== 'input' && WF.edges.some(e => e.to === n.id) && !reach.has(n.id)) issues.push({ lvl:'err', node:n.id, msg:`${n.title} can’t be reached from an input step.` });
    const outs = wfOutDefs(n);
    const open = outs.filter(p => !p.optional && !WF.edges.some(e => e.from === n.id && e.fromPort === p.id));
    if (outs.length > 1) open.forEach(p => issues.push({ lvl:'warn', node:n.id, msg:`The “${p.label}” output of ${n.title} isn’t connected. Records that take this path stop here.` }));
    else if (open.length && ['input','process','logic','doc','ai'].includes(t.cat)) issues.push({ lvl:'warn', node:n.id, msg:`The output of ${n.title} isn’t used by any later step.` });
    if (n.config && n.config.conn) { // global connection checks
      const gc = GCONNS.find(c => c.name === n.config.conn);
      if (!gc) issues.push({ lvl:'err', node:n.id, msg:`${n.title}: the connection “${n.config.conn}” no longer exists in Global connections.` });
      else if (!gc.on) issues.push({ lvl:'err', node:n.id, msg:`${n.title}: the connection “${gc.name}” is inactive, so this step can’t run.` });
      else if (gc.status === 'err') issues.push({ lvl:'warn', node:n.id, msg:`${n.title}: the connection “${gc.name}” is failing — the last test was rejected.` });
    }
  });
  WF.issues = issues;
  return issues;
}
function wfRunPort(n, sim) { // which output a record takes in a test run
  const t = wfType(n), outs = wfOuts(n);
  if (t.simulate) { const r = t.simulate(n, sim || wfSim()); if ('port' in r) return r.port; }
  const want = RUN_PORT[n.type] || 'success';
  return outs.includes(want) ? want : outs[0];
}
function wfPlan() { // order of steps the test will visit
  const sim = wfSim(), order = [], seen = new Set(), q = WF.nodes.filter(n => wfType(n).cat === 'input').map(n => n.id);
  while (q.length) {
    const id = q.shift(); if (seen.has(id)) continue; seen.add(id); order.push(id);
    const n = wfNode(id), port = wfRunPort(n, sim);
    WF.edges.filter(e => e.from === id && e.fromPort === port).forEach(e => q.push(e.to));
  }
  return order;
}
function wfRunOutcome() { // plain-language result of the last test
  const done = WF.nodes.filter(n => WF.run && WF.run.state[n.id] === 'succeeded');
  const sim = wfSim(), num = sim.ctx.invoice?.number || 'The sample';
  const email = done.find(n => n.type === 'send-email'), print = done.find(n => n.type === 'print-queue'), review = done.find(n => n.type === 'approval' || n.type === 'human-review');
  if (email) return `${num} would be emailed to ${wfResolve(email.config.to, sim.ctx).text}. Nothing was sent.`;
  if (print) return `${num} would join tonight’s print batch.`;
  if (review) return `${num} failed validation and would wait in ${review.title}.`;
  return `${num} completed ${done.length} steps.`;
}

function wfSetPanel(open, tab) {
  WF.panel.open = open; if (tab) WF.panel.tab = tab;
  $('#wfExec').classList.toggle('collapsed', !open);
  $('#wfExecToggle').setAttribute('aria-expanded', open);
  $('#wfExecToggle').setAttribute('aria-label', open ? 'Collapse test panel' : 'Expand test panel');
  $('#wfExecToggle').innerHTML = `<i data-lucide="${open ? 'chevron-down' : 'chevron-up'}"></i>`;
  wfDrawExec();
}
function wfTestRun() {
  if (WF.run && WF.run.active) return;
  if (!WF.nodes.some(n => wfType(n).cat === 'input')) { wfSetPanel(true, 'test'); return toast('Add an input step before running a test', 'circle-alert'); }
  WF.run = { active:true, state:{}, msg:{}, ms:{}, edge:{} };
  wfSetPanel(true, 'test'); wfDrawNodes(); wfDrawEdges();
  const queue = WF.nodes.filter(n => wfType(n).cat === 'input').map(n => n.id), seen = new Set();
  let total = 0, failedAt = null;
  const sim = wfSim();
  const next = () => {
    let id; do { id = queue.shift(); } while (id && seen.has(id));
    if (!id) {
      WF.run.active = false;
      WF.lastRun = { ok:!failedAt, ms:total, id:'RUN-' + (55121 + Math.floor(Math.random() * 80)), failedAt };
      wfDrawAll();
      return toast(failedAt ? `Test failed at ${failedAt}` : `Test run succeeded in ${total} ms`, failedAt ? 'circle-x' : 'circle-check');
    }
    seen.add(id);
    const n = wfNode(id), t = wfType(n);
    WF.edges.filter(e => e.to === id && WF.run.state[e.from] === 'succeeded').forEach(e => WF.run.edge[e.id] = 'flow');
    WF.run.state[id] = 'running'; WF.run.msg[id] = 'Running…';
    wfDrawNodes(); wfDrawEdges(); wfDrawExec();
    const res = t.simulate && !wfMissing(n).length ? t.simulate(n, sim) : null;
    const [msg, ms] = res ? [res.msg, res.ms || 10] : typeof t.run === 'function' ? t.run(n.config) : t.run;
    setTimeout(() => {
      if (!WF.run) return;
      WF.edges.filter(e => e.to === id && WF.run.edge[e.id]).forEach(e => WF.run.edge[e.id] = 'done');
      const miss = wfMissing(n);
      if (miss.length) {
        WF.run.state[id] = 'failed'; WF.run.msg[id] = `Missing setting: ${miss.map(f => f.l.toLowerCase()).join(', ')}`; WF.run.ms[id] = 0;
        failedAt = failedAt || n.title;
      } else {
        WF.run.state[id] = 'succeeded'; WF.run.ms[id] = ms; total += ms;
        WF.run.msg[id] = msg;
        const port = res && 'port' in res ? res.port : wfRunPort(n, sim);
        WF.edges.filter(e => e.from === id && e.fromPort === port).forEach(e => queue.push(e.to));
      }
      next();
    }, 340 + Math.min(ms, 420));
  };
  next();
}

/* ---------- Wiring ---------- */
function wfWire() {
  const canvas = $('#wfCanvas');
  $('#wfLibQ').oninput = wfDrawLib;
  $('#wfLibQ').addEventListener('keydown', e => { if (e.key === 'Enter') { const first = $('#wfLib [data-wftype]'); if (first) first.click(); } });
  $('#wfLib').addEventListener('dragstart', e => { const it = e.target.closest('[data-wftype]'); if (it) { e.dataTransfer.setData('text/plain', 'wf:' + it.dataset.wftype); e.dataTransfer.effectAllowed = 'copy'; } });
  $('#wfLib').addEventListener('click', e => {
    const it = e.target.closest('[data-wftype]'); if (!it) return;
    const r = canvas.getBoundingClientRect(), p = wfToWorld(r.left + r.width / 2, r.top + r.height / 2);
    const n = wfAddNode(it.dataset.wftype, p.x - NODE_W / 2, p.y - 50);
    toast(`${n.title} added as ${n.id}. Connect it to another step.`, 'plus');
  });
  canvas.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('text/plain')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; canvas.classList.add('drop-hover'); } });
  canvas.addEventListener('dragleave', e => { if (!canvas.contains(e.relatedTarget)) canvas.classList.remove('drop-hover'); });
  canvas.addEventListener('drop', e => {
    e.preventDefault(); canvas.classList.remove('drop-hover');
    const d = e.dataTransfer.getData('text/plain'); if (!d.startsWith('wf:') || !WF_TYPES[d.slice(3)]) return;
    const p = wfToWorld(e.clientX, e.clientY); wfAddNode(d.slice(3), p.x - NODE_W / 2, p.y - 25);
  });

  let act = null;
  // Where would a connection land? An input handle, or the body of a step (snaps to its nearest input).
  const dropTarget = (cx, cy) => {
    const el = document.elementFromPoint(cx, cy);
    const port = el?.closest('[data-in]');
    if (port) return { to:port.dataset.in, toPort:port.dataset.port };
    const nodeEl = el?.closest('[data-node]');
    if (!nodeEl) return null;
    const n = wfNode(nodeEl.dataset.node), ins = wfIns(n);
    if (!ins.length) return { to:n.id, toPort:null };
    const wy = wfToWorld(cx, cy).y - n.y;
    const best = ins.slice().sort((p, q) => Math.abs(wfPortY(n, 'in', p) - wy) - Math.abs(wfPortY(n, 'in', q) - wy))[0];
    return { to:n.id, toPort:best };
  };
  const endConnect = () => { WF.connecting = null; canvas.classList.remove('connecting'); };
  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const del = e.target.closest('[data-edgedel]');
    if (del) { e.preventDefault(); WF.selEdge = del.dataset.edgedel; wfDeleteSel(); return; }
    const out = e.target.closest('[data-out]');
    if (out) {
      act = { kind:'connect', from:out.dataset.out, port:out.dataset.port };
      WF.connecting = { from:act.from, port:act.port };
      canvas.classList.add('connecting');
      wfDrawNodes(); e.preventDefault(); return;
    }
    if (e.target.closest('[data-in]')) { e.preventDefault(); return toast('Start from an output handle on the right of a step, then drop on an input', 'circle-alert'); }
    const nodeEl = e.target.closest('[data-node]');
    if (nodeEl) {
      const n = wfNode(nodeEl.dataset.node);
      if (WF.sel !== n.id || WF.selEdge) wfSelect(n.id, null);
      act = { kind:'move', n, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false, el:$(`[data-node="${n.id}"]`) };
      e.preventDefault(); canvas.focus({ preventScroll:true }); return;
    }
    const edge = e.target.closest('[data-edge]');
    if (edge) { wfSelect(null, edge.dataset.edge); canvas.focus({ preventScroll:true }); return; }
    if (WF.sel || WF.selEdge) wfSelect(null, null);
    act = { kind:'pan', sx:e.clientX, sy:e.clientY, ox:WF.view.x, oy:WF.view.y };
    canvas.classList.add('panning'); canvas.focus({ preventScroll:true });
  });
  window.addEventListener('pointermove', e => {
    if (!act) return;
    if (act.kind === 'pan') { WF.view.x = act.ox + e.clientX - act.sx; WF.view.y = act.oy + e.clientY - act.sy; wfApplyView(); }
    else if (act.kind === 'move') {
      const dx = (e.clientX - act.sx) / WF.view.z, dy = (e.clientY - act.sy) / WF.view.z;
      if (!act.moved && Math.abs(dx) + Math.abs(dy) > 3) { wfPush(); act.moved = true; }
      if (!act.moved) return;
      act.n.x = Math.round((act.ox + dx) / 10) * 10; act.n.y = Math.round((act.oy + dy) / 10) * 10;
      act.el.style.left = act.n.x + 'px'; act.el.style.top = act.n.y + 'px'; wfDrawEdges();
    } else if (act.kind === 'connect') {
      const a = wfNode(act.from), p = wfToWorld(e.clientX, e.clientY);
      const t = dropTarget(e.clientX, e.clientY);
      const ok = t && t.toPort ? wfCanConnect(act.from, act.port, t.to, t.toPort) : null;
      let end = p;
      if (ok && ok.ok) { const b = wfNode(t.to); end = { x:b.x - 8, y:b.y + 1 + wfPortY(b, 'in', t.toPort) }; }
      wfDrawEdges({ d:wfEdgePath(a.x + NODE_W, a.y + 1 + wfPortY(a, 'out', act.port), end.x, end.y), bad:t && t.to !== act.from && !(ok && ok.ok) });
      $$('.wf-port.target').forEach(x => x.classList.remove('target'));
      if (ok && ok.ok) $(`[data-in="${t.to}"][data-port="${CSS.escape(t.toPort)}"]`)?.classList.add('target');
    }
  });
  window.addEventListener('pointerup', e => {
    if (!act) return;
    if (act.kind === 'pan') canvas.classList.remove('panning');
    if (act.kind === 'connect') {
      const t = dropTarget(e.clientX, e.clientY);
      endConnect();
      if (t && t.to !== act.from && !t.toPort) toast(`${wfNode(t.to).title} has no input, so nothing can connect to it`, 'circle-alert');
      else if (t && t.toPort) {
        const r = wfConnect(act.from, act.port, t.to, t.toPort);
        if (r.ok) {
          const a = wfNode(act.from), multi = wfOuts(a).length > 1;
          toast(`Connected ${a.title}${multi ? ' (' + wfOutLabel(a, act.port) + ')' : ''} to ${wfNode(t.to).title}`, 'link');
        } else toast(r.reason, 'circle-alert');
      }
      wfDrawNodes(); wfDrawEdges(); wfDrawProps();
    }
    if (act.kind === 'move' && act.moved) wfDrawEdges();
    act = null;
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && act && act.kind === 'connect') { act = null; endConnect(); wfDrawNodes(); wfDrawEdges(); } });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) wfZoomAt(WF.view.z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY);
    else { WF.view.x -= e.deltaX; WF.view.y -= e.deltaY; wfApplyView(); }
  }, { passive:false });

  $('#wfIn').onclick = () => wfZoomAt(WF.view.z * 1.2);
  $('#wfOut').onclick = () => wfZoomAt(WF.view.z / 1.2);
  $('#wfFit').onclick = wfFit;
  $('#wfSettingsBtn').onclick = () => { const on = !(WF.showSettings && !WF.sel && !WF.selEdge); WF.showSettings = on; wfSelect(null, null); };
  $('#wfUndo').onclick = wfUndo; $('#wfRedo').onclick = wfRedo;
  $('#wfSave').onclick = () => { WF.saved = new Date(); wfDrawToolbarState(); toast(`Draft v${WF.version} saved`, 'save'); };
  $('#wfValidate').onclick = () => {
    const is = wfValidate(), errs = is.filter(i => i.lvl === 'err').length;
    wfSetPanel(true, 'validation');
    toast(!is.length ? 'No problems found' : errs ? `${errs} problem${errs > 1 ? 's' : ''} must be fixed before publishing` : `${is.length} warning${is.length > 1 ? 's' : ''}, ready to publish`, errs ? 'circle-x' : is.length ? 'triangle-alert' : 'circle-check');
  };
  $('#wfTest').onclick = wfTestRun;
  $('#wfPublish').onclick = () => {
    const errs = wfValidate().filter(i => i.lvl === 'err').length;
    if (errs) { wfSetPanel(true, 'validation'); return toast(`Fix ${errs} problem${errs > 1 ? 's' : ''} before publishing`, 'circle-x'); }
    WF.status = 'published'; WF.saved = new Date(); wfDrawToolbarState(); wfDrawProps(); wfDrawExec();
    AUDIT.unshift({ ts:new Date(), actor:PEOPLE[0], action:'Workflow published', resource:`${WF.name} v${WF.version}`, icon:'workflow', detail:`${WF.nodes.length} steps, ${WF.edges.length} connections`, ip:'82.116.40.12', hash:'b' + Date.now().toString(16).slice(-9) });
    toast(`Published ${WF.name} v${WF.version}`, 'upload-cloud');
  };
  $('#wfExecToggle').onclick = () => wfSetPanel(!WF.panel.open);
  $('#wfTabs').addEventListener('click', e => { const b = e.target.closest('[data-wftab]'); if (b) wfSetPanel(true, b.dataset.wftab); });

  document.addEventListener('keydown', e => {
    if ($('#view-workflow').hidden) return;
    if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); wfUndo(); }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); wfRedo(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && (WF.sel || WF.selEdge)) { e.preventDefault(); wfDeleteSel(); }
    else if (k === 'f' && !mod) wfFit();
    else if (k === '+' || k === '=') wfZoomAt(WF.view.z * 1.2);
    else if (k === '-') wfZoomAt(WF.view.z / 1.2);
    else if (WF.sel && ['arrowleft','arrowright','arrowup','arrowdown'].includes(k)) {
      e.preventDefault(); wfPush(); const n = wfNode(WF.sel), s = e.shiftKey ? 50 : 10;
      n.x += k === 'arrowleft' ? -s : k === 'arrowright' ? s : 0; n.y += k === 'arrowup' ? -s : k === 'arrowdown' ? s : 0;
      wfDrawNodes(); wfDrawEdges();
    }
  });
  window.addEventListener('resize', () => { if (!$('#view-workflow').hidden) wfApplyView(); });
}

let cmdSel = 0, cmdList = [];
function openCmd() { $('#cmdk').classList.add('open'); $('#cmdkInput').value = ''; drawCmd(); setTimeout(() => $('#cmdkInput').focus(), 20); }
function drawCmd() {
  const q = $('#cmdkInput').value.toLowerCase();
  cmdList = CMDS.filter(c => !q || c.t.toLowerCase().includes(q) || c.k.toLowerCase().includes(q)).slice(0, 12);
  cmdSel = Math.min(cmdSel, Math.max(0, cmdList.length - 1));
  $('#cmdkList').innerHTML = cmdList.map((c, i) => `<div class="cmdk-item" role="option" data-i="${i}" aria-selected="${i === cmdSel}"><i data-lucide="${c.i}"></i>${esc(c.t)}<span class="k">${esc(c.k)}</span></div>`).join('') || `<div class="empty">Nothing matches. Try a template, job ID or customer.</div>`;
  icons();
}
$('#openCmd').onclick = openCmd;
$('#cmdkInput').oninput = () => { cmdSel = 0; drawCmd(); };
$('#cmdkList').onclick = e => { const it = e.target.closest('[data-i]'); if (it) { $('#cmdk').classList.remove('open'); cmdList[+it.dataset.i].run(); } };
$('#cmdk').onclick = e => { if (e.target === $('#cmdk')) $('#cmdk').classList.remove('open'); };
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }

  if ($('#cmdk').classList.contains('open')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = (cmdSel + 1) % cmdList.length; drawCmd(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel - 1 + cmdList.length) % cmdList.length; drawCmd(); }
    if (e.key === 'Enter' && cmdList[cmdSel]) { $('#cmdk').classList.remove('open'); cmdList[cmdSel].run(); }
  }
});

   Boot
   ========================================================= */
const RENDER = { dashboard:renderDashboard, designer:renderDesigner, workflow:renderWorkflow, preview:renderPreview, assistant:renderAssistant, jobs:renderJobs, integrations:renderIntegrations, connections:renderConnections, variables:renderVariables, archive:renderArchive, audit:renderAudit };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintThemeIcon(); if (!$('#view-dashboard').hidden) renderDashboard(); });
paintThemeIcon();
updateFailCount();
go(location.hash.slice(1) || 'workflow');
</script>
