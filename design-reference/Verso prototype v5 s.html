<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verso — Document generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EEF2F5;
  --line:#DDE3E9; --line-strong:#C4CDD6;
  --ink:#13202B; --ink-2:#4A5866; --ink-3:#7B8895;
  --cyan:#0A6E8A; --cyan-strong:#075A72; --cyan-soft:#E0EFF4;
  --magenta:#A82E6B; --magenta-soft:#F6E5EE;
  --yellow:#E8B30F;
  --ok:#1E8556; --ok-soft:#E2F2E9; --warn:#A86E12; --warn-soft:#FAEFD9; --err:#BE3D37; --err-soft:#FAE6E4;
  --paper:#FFFFFF; --paper-ink:#1A232C; --paper-mute:#66727E; --paper-line:#E3E7EB;
  --stage:#E3E7EB; --stage-dot:#CDD4DB;
  --sheet-shadow:0 1px 2px rgba(19,32,43,.10), 0 18px 40px -16px rgba(19,32,43,.30);
  --pop-shadow:0 12px 40px -12px rgba(19,32,43,.35), 0 2px 6px rgba(19,32,43,.08);
  --r-lg:12px; --r-md:8px; --r-sm:5px;
  --font:'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E141A; --surface:#151D25; --surface-2:#1A232D; --surface-3:#202B36;
    --line:#26323D; --line-strong:#354350;
    --ink:#E3E9EF; --ink-2:#A7B3BF; --ink-3:#76838F;
    --cyan:#4DB4D1; --cyan-strong:#7CCBE0; --cyan-soft:#11303A;
    --magenta:#E57DB1; --magenta-soft:#38192A;
    --ok:#4BC28A; --ok-soft:#12301F; --warn:#E0A84A; --warn-soft:#33260F; --err:#EE7A72; --err-soft:#3A1715;
    --stage:#0B1015; --stage-dot:#1D2731;
    --sheet-shadow:0 1px 2px rgba(0,0,0,.4), 0 24px 50px -18px rgba(0,0,0,.7);
    --pop-shadow:0 16px 48px -12px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E141A; --surface:#151D25; --surface-2:#1A232D; --surface-3:#202B36;
  --line:#26323D; --line-strong:#354350;
  --ink:#E3E9EF; --ink-2:#A7B3BF; --ink-3:#76838F;
  --cyan:#4DB4D1; --cyan-strong:#7CCBE0; --cyan-soft:#11303A;
  --magenta:#E57DB1; --magenta-soft:#38192A;
  --ok:#4BC28A; --ok-soft:#12301F; --warn:#E0A84A; --warn-soft:#33260F; --err:#EE7A72; --err-soft:#3A1715;
  --stage:#0B1015; --stage-dot:#1D2731;
  --sheet-shadow:0 1px 2px rgba(0,0,0,.4), 0 24px 50px -18px rgba(0,0,0,.7);
  --pop-shadow:0 16px 48px -12px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.brand-mark span{position:absolute;width:12px;height:12px;border-radius:50%;mix-blend-mode:multiply}
.brand-mark .c{background:#00A9D4;left:5px;top:6px}
.brand-mark .m{background:#D43A8C;left:12px;top:6px}
.brand-mark .y{background:#F2C200;left:8.5px;top:12px}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--ink-3);margin-top:-2px}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav-group{font-size:12px;color:var(--ink-3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--cyan-soft);color:var(--cyan-strong)}
.nav a[aria-current="page"] svg{color:var(--cyan)}
.nav a .count{margin-left:auto;font-size:11.5px;background:var(--err-soft);color:var(--err);padding:1px 7px;border-radius:999px;font-weight:600}
.nav a.ai{color:var(--magenta)}
.nav a.ai[aria-current="page"]{background:var(--magenta-soft);color:var(--magenta)}
.nav a.ai[aria-current="page"] svg{color:var(--magenta)}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.side-foot .who{font-weight:600;font-size:13px;line-height:1.2}
.side-foot .org{font-size:12px;color:var(--ink-3)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.topbar h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.005em;white-space:nowrap}
.crumb{color:var(--ink-3);font-size:13px;white-space:nowrap}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:260px;padding:7px 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;color:var(--ink-3);text-align:left}
.search-btn kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2);background:var(--surface)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--err);border:2px solid var(--surface)}
.menu-btn{display:none}
.view{flex:1;overflow:auto;min-height:0}
.view[hidden]{display:none!important}
.pad{padding:24px 28px 40px;max-width:1440px}

/* ---------- Primitives ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06202A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06202A}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ai{border-color:var(--magenta);color:var(--magenta);background:var(--magenta-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{font-size:14.5px;font-weight:600;margin:0}
.panel-h .act{margin-left:auto;display:flex;gap:6px}
.panel-b{padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.run{background:var(--cyan-soft);color:var(--cyan)}
.pill.run::before{animation:blink 1.2s infinite}
.pill.plain::before{display:none}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
@keyframes blink{50%{opacity:.25}}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);min-width:0}
textarea.input{resize:vertical;min-height:64px}
.input:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;padding:2px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{appearance:none;margin:0;width:34px;height:20px;border-radius:999px;background:var(--line-strong);transition:background .15s;cursor:pointer}
.switch input:checked{background:var(--cyan)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked::after{transform:translateX(14px)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.grid{display:grid;gap:16px}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:inherit;transition:width .6s}
.bar.err i{background:var(--err)} .bar.ok i{background:var(--ok)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- Dashboard ---------- */
.dash-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.dash-head h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15}
.dash-head p{margin:4px 0 0;color:var(--ink-2)}
.dash-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.output-hero{padding:20px 20px 12px}
.output-stats{display:flex;gap:36px;flex-wrap:wrap;margin-bottom:12px}
.ostat .v{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.ostat .k{font-size:13px;color:var(--ink-2)}
.ostat .d{font-size:12.5px;color:var(--ok);font-weight:500}
.ostat .d.neg{color:var(--err)}
.chart svg{width:100%;height:220px;display:block}
.chart .gridline{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.attn-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.attn-item:last-child{border-bottom:0}
.attn-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.attn-ico.err{background:var(--err-soft);color:var(--err)}
.attn-ico.warn{background:var(--warn-soft);color:var(--warn)}
.attn-ico.ai{background:var(--magenta-soft);color:var(--magenta)}
.attn-ico.info{background:var(--cyan-soft);color:var(--cyan)}
.attn-item h4{margin:0;font-size:13.5px;font-weight:600}
.attn-item p{margin:2px 0 6px;font-size:13px;color:var(--ink-2)}
.channel-row{display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.channel-row .bar{height:8px}
.tpl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tpl{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.tpl:hover{border-color:var(--line-strong)}
.tpl-thumb{height:120px;background:var(--stage);display:grid;place-items:end center;padding-top:14px;overflow:hidden}
.tpl-thumb .mini{width:120px;height:110px;background:#fff;box-shadow:var(--sheet-shadow);padding:10px;border-radius:1px 1px 0 0}
.mini i{display:block;height:4px;background:#DCE2E8;border-radius:2px;margin-bottom:5px}
.mini i.h{height:7px;width:45%;background:#1A232C}
.mini i.a{background:var(--cyan);width:30%}
.tpl-meta{padding:10px 12px}
.tpl-meta b{display:block;font-size:13.5px;font-weight:600}
.tpl-meta span{font-size:12.5px;color:var(--ink-3)}

/* ---------- Stage / A4 sheet (signature element) ---------- */
.stage{background-color:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px, transparent 1px);background-size:16px 16px;overflow:auto;position:relative}
.sheet-holder{margin:44px auto 60px;position:relative}
.sheet{position:absolute;left:0;top:0;width:794px;height:1123px;background:var(--paper);color:var(--paper-ink);box-shadow:var(--sheet-shadow);transform-origin:0 0;font-family:var(--font);overflow:hidden}
.crop{position:absolute;width:22px;height:22px;pointer-events:none;color:var(--ink-3);opacity:.8}
.crop::before,.crop::after{content:"";position:absolute;background:currentColor}
.crop.tl{left:-30px;top:-30px}.crop.tr{right:-30px;top:-30px}.crop.bl{left:-30px;bottom:-30px}.crop.br{right:-30px;bottom:-30px}
.crop.tl::before,.crop.bl::before{right:0;width:14px;height:1px}
.crop.tr::before,.crop.br::before{left:0;width:14px;height:1px}
.crop.tl::before,.crop.tr::before{bottom:0}
.crop.bl::before,.crop.br::before{top:0}
.crop.tl::after,.crop.tr::after{bottom:-8px;width:1px;height:14px}
.crop.bl::after,.crop.br::after{top:-8px;width:1px;height:14px}
.crop.tl::after,.crop.bl::after{right:8px}
.crop.tr::after,.crop.br::after{left:8px}
.crop.tl::before{bottom:8px;right:-8px}.crop.tr::before{bottom:8px;left:-8px}
.crop.bl::before{top:8px;right:-8px}.crop.br::before{top:8px;left:-8px}
.reg{position:absolute;left:50%;top:-38px;transform:translateX(-50%);color:var(--ink-3);opacity:.8;pointer-events:none}
.colorbar{position:absolute;left:0;bottom:-26px;display:flex;gap:0;height:10px;pointer-events:none}
.colorbar i{width:18px;height:10px;display:block}
.slug{position:absolute;right:0;bottom:-28px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);pointer-events:none;white-space:nowrap}

/* Document typography inside sheet */
.doc{position:absolute;inset:0;padding:56px 56px 48px;font-size:11.5px;line-height:1.5;color:var(--paper-ink)}
.doc h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1}
.doc .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.doc .logo .sun{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,#F2B705,#E86A1C,#F2B705);position:relative}
.doc .logo .sun::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.doc .logo.bank .sun{background:conic-gradient(from 0deg,#0B4F6C,#1D7FA6,#0B4F6C);border-radius:6px}
.doc .logo.bank .sun::after{border-radius:2px;inset:8px}
.doc .mute{color:var(--paper-mute)}
.doc .hdr{display:flex;justify-content:space-between;align-items:flex-start}
.doc .addr-row{display:flex;justify-content:space-between;margin-top:46px;gap:30px}
.doc .window{width:290px;min-height:96px}
.doc .window .sender{font-size:8.5px;color:var(--paper-mute);border-bottom:.5px solid var(--paper-line);padding-bottom:3px;margin-bottom:6px}
.doc .meta{display:grid;grid-template-columns:auto auto;gap:3px 18px;align-content:start;font-size:11px}
.doc .meta dt{color:var(--paper-mute)}
.doc .meta dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.doc table{width:100%;border-collapse:collapse;margin-top:30px;font-size:11px}
.doc th{text-align:left;font-weight:600;padding:7px 6px;border-bottom:1.2px solid var(--paper-ink);font-size:10px;color:var(--paper-ink)}
.doc td{padding:7px 6px;border-bottom:.5px solid var(--paper-line);vertical-align:top;font-variant-numeric:tabular-nums}
.doc td.r,.doc th.r{text-align:right}
.doc .totals{margin-left:auto;width:250px;margin-top:14px;font-variant-numeric:tabular-nums}
.doc .totals div{display:flex;justify-content:space-between;padding:4px 6px}
.doc .totals .grand{border-top:1.2px solid var(--paper-ink);margin-top:4px;padding-top:8px;font-weight:700;font-size:14px}
.doc .pay{position:absolute;left:56px;right:56px;bottom:108px;display:flex;gap:18px;padding:14px;border:.6px solid var(--paper-line);border-radius:4px;background:#F8FAFB}
.doc .pay h4{margin:0 0 4px;font-size:11px}
.doc .foot{position:absolute;left:56px;right:56px;bottom:40px;border-top:.5px solid var(--paper-line);padding-top:8px;font-size:8.5px;color:var(--paper-mute);display:flex;justify-content:space-between;gap:20px}
.doc .neg{color:#B3261E}
.doc .summary{display:grid;grid-template-columns:repeat(4,1fr);border:.6px solid var(--paper-line);border-radius:4px;margin-top:28px}
.doc .summary div{padding:10px 12px;border-right:.6px solid var(--paper-line)}
.doc .summary div:last-child{border-right:0}
.doc .summary b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.doc .note{font-size:10px;color:var(--paper-mute);margin-top:12px;max-width:520px}

/* ---------- Designer ---------- */
.designer{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;height:100%;min-height:0}
.dz-side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;min-height:0}
.dz-props{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0}
.dz-sec{padding:14px 14px 16px;border-bottom:1px solid var(--line)}
.dz-sec h3{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dz-sec h3 .muted{font-weight:400;margin-left:auto;font-size:12px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal-item{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:12.5px;font-weight:500;cursor:grab;user-select:none;text-align:left;color:var(--ink)}
.pal-item:hover{border-color:var(--cyan);color:var(--cyan-strong)}
.pal-item svg{color:var(--ink-2)}
.tree{font-size:13px}
.tree details{margin:0}
.tree summary{list-style:none;display:flex;align-items:center;gap:6px;padding:4px 4px;border-radius:5px;cursor:pointer;font-weight:500}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--surface-2)}
.tree summary svg.chev{transition:transform .15s;width:14px;height:14px;color:var(--ink-3)}
.tree details[open]>summary svg.chev{transform:rotate(90deg)}
.tree .leaf{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 24px;border-radius:5px;cursor:grab;user-select:none}
.tree .leaf:hover{background:var(--cyan-soft)}
.tree .leaf .ty{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tree .leaf .mapped{color:var(--ok);width:14px;height:14px}
.tree .leaf.unmapped .nm{color:var(--ink-2)}
.dz-center{display:flex;flex-direction:column;min-width:0;min-height:0}
.dz-toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dz-toolbar .tname{font-weight:600;font-size:14px;margin-right:6px}
.dz-toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.dz-stage{flex:1;min-height:0}
.dz-status{display:flex;gap:16px;align-items:center;padding:6px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.dz-status span{display:inline-flex;align-items:center;gap:5px}
.sheet.design.showgrid{background-image:linear-gradient(rgba(10,110,138,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(10,110,138,.07) 1px,transparent 1px);background-size:16px 16px}
.sheet.design .margins{position:absolute;inset:48px 56px;border:1px dashed rgba(10,110,138,.25);pointer-events:none}
.sheet.drop-hover{outline:2px dashed var(--cyan);outline-offset:6px}
.el{position:absolute;cursor:move;border:1px dashed transparent;border-radius:2px;font-size:11.5px;line-height:1.4;color:var(--paper-ink);overflow:hidden}
.el:hover{border-color:rgba(10,110,138,.45)}
.el.sel{border:1.5px solid #0A6E8A;overflow:visible;z-index:5}
.el .handle{display:none;position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:#fff;border:1.5px solid #0A6E8A;border-radius:2px;cursor:nwse-resize}
.el.sel .handle{display:block}
.el .tagname{display:none;position:absolute;left:-1.5px;top:-19px;background:#0A6E8A;color:#fff;font-size:10.5px;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap;font-family:var(--font)}
.el.sel .tagname{display:block}
.el.drop-target{outline:2px solid #A82E6B;outline-offset:2px}
.chip-bind{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;background:#E0EFF4;color:#075A72;border-radius:3px;padding:0 4px;white-space:nowrap}
.chip-bind.missing{background:#FAE6E4;color:#BE3D37}
.el .flab{color:var(--paper-mute);margin-right:6px}
.el.ai-added{animation:aiPulse 1.6s ease-out 1}
@keyframes aiPulse{0%{box-shadow:0 0 0 0 rgba(168,46,107,.55)}100%{box-shadow:0 0 0 14px rgba(168,46,107,0)}}
.props-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.props-grid .full{grid-column:1/-1}
.bind-box{display:flex;gap:6px;align-items:center}
.bind-drop{flex:1;padding:7px 10px;border:1px dashed var(--line-strong);border-radius:7px;font-family:var(--mono);font-size:12px;color:var(--ink-2);min-height:34px;display:flex;align-items:center;gap:6px}
.bind-drop.has{border-style:solid;color:var(--cyan-strong);background:var(--cyan-soft);border-color:transparent}
.bind-drop.hover{border-color:var(--magenta);background:var(--magenta-soft)}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.layer{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.layer:hover{background:var(--surface-2)}
.layer.sel{background:var(--cyan-soft);color:var(--cyan-strong)}
.layer .mono{margin-left:auto;font-size:11px;color:var(--ink-3)}
.ai-suggest{border:1px solid var(--magenta-soft);background:linear-gradient(var(--magenta-soft),var(--magenta-soft)) padding-box;border-radius:8px;padding:10px 12px;font-size:12.5px}
.ai-suggest b{color:var(--magenta);display:flex;align-items:center;gap:6px;margin-bottom:4px}

/* ---------- Preview ---------- */
.preview{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100%;min-height:0}
.pv-stage{display:flex;flex-direction:column;min-height:0}
.pv-side{background:var(--surface);border-left:1px solid var(--line);overflow:auto}
.check{display:flex;gap:9px;padding:7px 0;font-size:13px;align-items:flex-start}
.check svg{margin-top:1px}
.check.ok svg{color:var(--ok)} .check.warn svg{color:var(--warn)} .check.ai svg{color:var(--magenta)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ch-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;text-align:left}
.ch-opt[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-soft);color:var(--cyan-strong)}

/* ---------- AI ---------- */
.ai-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%;min-height:0}
.chat{display:flex;flex-direction:column;min-height:0}
.chat-log{flex:1;overflow:auto;padding:28px 28px 12px}
.chat-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .who{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.msg.bot .who{background:var(--magenta-soft);color:var(--magenta)}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--cyan);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:80%}
:root[data-theme="dark"] .msg.me .bubble{color:#06202A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.me .bubble{color:#06202A}}
.msg.bot .bubble{max-width:100%;min-width:0;flex:1;padding-top:4px}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:4px 0 8px;padding-left:20px}
.bubble code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:1px 5px;border-radius:4px}
.bubble .card{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0;overflow:hidden}
.bubble .card-h{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.bubble .card-b{padding:12px}
.bubble .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.letter{font-family:var(--serif);font-size:14px;line-height:1.6;white-space:pre-wrap}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--magenta);opacity:.4;animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{50%{opacity:1;transform:translateY(-2px)}}
.composer{padding:12px 28px 20px}
.composer-box{max-width:760px;margin:0 auto;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 10px 8px 14px}
.composer-box:focus-within{border-color:var(--magenta);box-shadow:0 0 0 3px var(--magenta-soft)}
.composer textarea{width:100%;border:0;resize:none;background:none;outline:none;min-height:44px;max-height:160px}
.composer .row{justify-content:space-between}
.sugg{display:flex;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto 10px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.sugg button:hover{border-color:var(--magenta);color:var(--magenta)}
.ai-ctx{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:4px 0}
.ctx-item{display:flex;gap:10px;padding:8px 16px;font-size:13px;align-items:flex-start}
.ctx-item svg{color:var(--ink-3);margin-top:2px}

/* ---------- Integrations ---------- */
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.int{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.int-top{display:flex;gap:12px;align-items:center}
.int-logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.int h4{margin:0;font-size:14px}
.int .cat{font-size:12px;color:var(--ink-3)}
.int p{margin:0;font-size:13px;color:var(--ink-2);flex:1}
.int-foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.int-foot .btn{margin-left:auto}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sec-title:first-child{margin-top:0}
.sec-title h3{margin:0;font-size:15.5px;font-weight:600}
.sec-title p{margin:0;color:var(--ink-3);font-size:13px}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--pop-shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-h h3{margin:0;font-size:16px}
.drawer-b{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.drawer-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.log{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;line-height:1.7;white-space:pre-wrap;overflow-x:auto}
.log .e{color:var(--err)} .log .w{color:var(--warn)} .log .i{color:var(--ink-3)}
.modal{position:fixed;inset:0;z-index:42;display:grid;place-items:center;padding:20px;pointer-events:none}
.modal-card{background:var(--surface);border-radius:14px;box-shadow:var(--pop-shadow);width:min(980px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(8px) scale(.98);transition:.18s;pointer-events:none}
.modal.open .modal-card{opacity:1;transform:none;pointer-events:auto}
.modal-body{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:0;flex:1}

/* Command palette */
.cmdk{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,16,22,.4)}
.cmdk.open{display:flex}
.cmdk-box{width:min(560px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--pop-shadow);overflow:hidden;border:1px solid var(--line)}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;outline:0;background:none;flex:1;font-size:15px}
.cmdk-list{max-height:340px;overflow:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.cmdk-item[aria-selected="true"]{background:var(--cyan-soft);color:var(--cyan-strong)}
.cmdk-item .k{margin-left:auto;font-size:12px;color:var(--ink-3)}

/* Toast */
.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13.5px;box-shadow:var(--pop-shadow);animation:tin .2s ease-out}
.toast svg{color:var(--bg)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* Archive & audit */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line)}
.filters .field{min-width:150px}
.search-big{flex:1;min-width:240px;position:relative}
.search-big svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-big input{padding-left:34px;height:38px;font-size:14px}
mark{background:#FCE9A6;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark{background:#5A4A12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:#5A4A12}}
.chain{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:16px;flex-wrap:wrap}
.chain-blocks{display:flex;gap:3px;align-items:center}
.chain-blocks i{width:14px;height:14px;border-radius:3px;background:var(--ok-soft);border:1px solid var(--ok)}
.chain-blocks b{width:8px;height:1px;background:var(--ok)}
.act-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.act-ico svg{width:14px;height:14px}
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-bottom:16px}
.stat-strip>div{padding:14px 16px;border-right:1px solid var(--line)}
.stat-strip>div:last-child{border-right:0}
.stat-strip .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat-strip .k{font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 10px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cyan)}
.tabs .n{font-size:11.5px;background:var(--surface-3);border-radius:999px;padding:0 6px;color:var(--ink-2)}


/* ---------- Workflow designer ---------- */
:root{
  --cat-input:#0A6E8A;   --cat-input-ink:#075A72;
  --cat-process:#B7791F; --cat-process-ink:#7E520B;
  --cat-logic:#5B6773;   --cat-logic-ink:#3F4A55;
  --cat-doc:#6B4FA0;     --cat-doc-ink:#523A80;
  --cat-ai:#A82E6B;      --cat-ai-ink:#8A2357;
  --cat-output:#1E8556;  --cat-output-ink:#156640;
}
:root[data-theme="dark"]{
  --cat-input:#4DB4D1; --cat-input-ink:#8AD3E6; --cat-process:#E0A84A; --cat-process-ink:#F0C886;
  --cat-logic:#9AA6B2; --cat-logic-ink:#C3CCD5; --cat-doc:#A892DA; --cat-doc-ink:#C9BBEE;
  --cat-ai:#E57DB1; --cat-ai-ink:#F2AED0; --cat-output:#4BC28A; --cat-output-ink:#85DDB3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cat-input:#4DB4D1; --cat-input-ink:#8AD3E6; --cat-process:#E0A84A; --cat-process-ink:#F0C886;
  --cat-logic:#9AA6B2; --cat-logic-ink:#C3CCD5; --cat-doc:#A892DA; --cat-doc-ink:#C9BBEE;
  --cat-ai:#E57DB1; --cat-ai-ink:#F2AED0; --cat-output:#4BC28A; --cat-output-ink:#85DDB3;
}}
.seg[hidden]{display:none}
.wf{display:grid;grid-template-columns:232px minmax(0,1fr) 296px;grid-template-rows:auto minmax(0,1fr);height:100%;min-height:0}
.wf-toolbar{grid-column:1/-1}
.wf-lib{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.wf-lib-search{padding:12px 12px 8px;position:relative}
.wf-lib-search svg{position:absolute;left:22px;top:50%;transform:translateY(-35%);color:var(--ink-3)}
.wf-lib-search input{padding-left:32px}
.wf-lib-list{overflow:auto;padding:0 8px 16px;flex:1}
.wf-cat{font-size:12.5px;color:var(--ink-3);padding:12px 6px 6px;display:flex;align-items:center;gap:7px}
.wf-cat i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.wf-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:grab;user-select:none;width:100%;border:0;background:none;text-align:left;color:var(--ink)}
.wf-item:hover{background:var(--surface-2)}
.wf-item .wf-ico{width:28px;height:28px}
.wf-item b{display:block;font-size:13px;font-weight:500}
.wf-item small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.wf-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb, var(--c) 13%, transparent)}
.wf-mid{display:flex;flex-direction:column;min-width:0;min-height:0}
.wf-canvas{flex:1;min-height:0;position:relative;overflow:hidden;background-color:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px, transparent 1px);cursor:grab;user-select:none;touch-action:none}
.wf-canvas.panning{cursor:grabbing}
.wf-canvas.drop-hover{box-shadow:inset 0 0 0 2px var(--cyan)}
.wf-world{position:absolute;left:0;top:0;transform-origin:0 0}
.wf-edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wf-edges path.e{fill:none;stroke:var(--line-strong);stroke-width:2}
.wf-edges path.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.wf-edges path.e.sel{stroke:var(--cyan);stroke-width:2.5}
.wf-edges path.e.done{stroke:var(--ok)}
.wf-edges path.e.flow{stroke:var(--cyan);stroke-dasharray:6 6;animation:wfFlow .5s linear infinite}
.wf-edges path.e.temp{stroke:var(--cyan);stroke-dasharray:4 4}
.wf-edges .arrow{fill:var(--line-strong)}
.wf-edges .arrow.sel{fill:var(--cyan)} .wf-edges .arrow.done{fill:var(--ok)} .wf-edges .arrow.flow{fill:var(--cyan)}
@keyframes wfFlow{to{stroke-dashoffset:-12}}
.wf-node{position:absolute;width:228px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:inset 3px 0 0 var(--c), 0 1px 2px rgba(19,32,43,.08);cursor:move}
.wf-node:hover{border-color:var(--ink-3)}
.wf-node.sel{border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--c), 0 0 0 3px var(--cyan-soft)}
.wf-node.s-running{border-color:var(--cyan)}
.wf-node.s-succeeded{border-color:var(--ok)}
.wf-node.s-failed{border-color:var(--err);box-shadow:inset 3px 0 0 var(--c), 0 0 0 3px var(--err-soft)}
.wf-node-h{height:50px;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px}
.wf-node-h .t{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.wf-node-h b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.cat-label{display:inline-block;font-size:11px;font-weight:500;line-height:16px;padding:0 6px;border-radius:4px;color:var(--ci);background:color-mix(in srgb, var(--c) 14%, transparent);white-space:nowrap}
.wf-node-b{height:22px;line-height:18px;padding:0 12px 4px 14px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-node-b.missing{color:var(--warn)}
.wf-node-s{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-top:1px solid var(--line)}
.wf-node-s .nid{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.wf-status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500}
.wf-status svg{width:13px;height:13px}
.wf-status.incomplete{color:var(--warn)}
.wf-status.configured{color:var(--ink-2)}
.wf-status.running{color:var(--cyan)} .wf-status.running svg{animation:spin 1s linear infinite}
.wf-status.succeeded{color:var(--ok)}
.wf-status.failed{color:var(--err)}
@keyframes spin{to{transform:rotate(360deg)}}
.wf-node-r{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11.5px;color:var(--ink-3);border-top:1px dashed var(--line)}
.wf-port{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);cursor:crosshair;z-index:2}
.wf-port::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.wf-port.in{left:-8px}.wf-port.out{right:-8px}
.wf-port.out{border-color:var(--c)}
.wf-port.many{border-radius:4px;height:22px}
.wf-port:hover,.wf-port.hot{border-color:var(--cyan);background:var(--cyan-soft);transform:scale(1.2)}
.wf-legend{position:absolute;left:12px;top:12px;display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none}
.wf-legend .wf-status{font-size:12px}
.wf-item mark{background:#FCE9A6;color:inherit;border-radius:2px}
.wf-cat .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.wf-cat b{font-weight:600;color:var(--ink)}
.req{color:var(--err);font-weight:500;font-size:11.5px;margin-left:4px}
.input.missing{border-color:var(--warn);background:var(--warn-soft)}
.conn-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.conn-row .mono{font-size:11.5px;color:var(--ink-3);min-width:70px}
.wf-hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px;pointer-events:none}
.wf-minimap{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.wf-props{background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-height:0}
.wf-props .dz-sec h3 .wf-ico{width:26px;height:26px}
.wf-props .grid{gap:10px}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0}
.copy-field{display:flex;gap:6px}
.copy-field .input{font-family:var(--mono);font-size:12px;background:var(--surface-2)}
.map-t{width:100%;border-collapse:collapse;font-size:12px}
.map-t td{padding:5px 4px;border-bottom:1px solid var(--line)}
.map-t td:nth-child(2){color:var(--ink-3);width:16px;text-align:center}
.map-t .mono{font-size:11.5px}
.wf-exec{background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;height:280px;flex:none;transition:height .2s}
.wf-exec.collapsed{height:41px}
.wf-exec-h{display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;border-bottom:1px solid var(--line);min-height:40px}
.wf-exec-h .tabs{border:0;padding:0 4px}
.wf-exec-h .tabs button{padding:10px 8px}
.wf-exec.collapsed .wf-exec-h{border-bottom:0}
.wf-exec-sum{margin-left:auto;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.wf-exec-b{flex:1;overflow:auto;min-height:0}
.wf-exec.collapsed .wf-exec-b{display:none}
.wf-test{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:0;height:100%}
.wf-test>div{padding:12px 16px;min-width:0;overflow:auto}
.wf-test>div:first-child{border-right:1px solid var(--line)}
.wf-test .log{margin:8px 0 0;max-height:none;font-size:11.5px;line-height:1.55;white-space:pre}
.wf-test .lbl{white-space:nowrap}
.step{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.step:last-child{border-bottom:0}
.step .ic svg{width:16px;height:16px}
.step.ok .ic{color:var(--ok)} .step.err .ic{color:var(--err)} .step.run .ic{color:var(--cyan)} .step.run .ic svg{animation:spin 1s linear infinite} .step.wait .ic,.step.skip .ic{color:var(--ink-3)}
.step small{display:block;color:var(--ink-3);font-size:12px}
.step .ms{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.issue .ic{margin-top:1px}
.issue.err .ic{color:var(--err)} .issue.warn .ic{color:var(--warn)} .issue.ok .ic{color:var(--ok)}
.issue .btn{margin-left:auto}


/* ---------- Workflow connections ---------- */
.wf.props-closed{grid-template-columns:232px minmax(0,1fr) 0}
.wf.props-closed .wf-props{display:none}
.wf-props-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.wf-props-h b{font-size:13px;font-weight:600}
.wf-props-h .icon-btn{margin-left:auto}
#wfSettingsBtn[aria-pressed="true"]{background:var(--cyan-soft);color:var(--cyan-strong);border-color:transparent}
.wf-edges g.edge:hover path.e:not(.sel):not(.flow):not(.done){stroke:var(--ink-3)}
.wf-edges g.edge:hover path.arrow:not(.sel):not(.flow):not(.done){fill:var(--ink-3)}
.wf-edges path.e.temp.bad{stroke:var(--err)}
.wf-edges .elabel rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1}
.wf-edges .elabel text{font-family:var(--font);font-size:11px;font-weight:500;fill:var(--ink-2)}
.wf-edges .elabel.sel rect{stroke:var(--cyan)} .wf-edges .elabel.sel text{fill:var(--cyan-strong)}
.wf-edges .elabel.done rect{stroke:var(--ok)}
.wf-edges .edel{pointer-events:all;cursor:pointer}
.wf-edges .edel circle{fill:var(--surface);stroke:var(--err);stroke-width:1.5}
.wf-edges .edel path{stroke:var(--err);stroke-width:2;stroke-linecap:round}
.wf-edges .edel:hover circle{fill:var(--err-soft)}
.wf-port.opt{border-style:dashed}
.wf-node-r .pout.opt{font-style:italic}
.wf-node-r .pout{color:var(--ink-2);font-weight:500}
.wf-canvas.connecting{cursor:crosshair}
.wf-canvas.connecting .wf-port.in.can{border-color:var(--cyan);background:var(--cyan-soft)}

.wf-canvas.connecting .wf-node{cursor:crosshair}
.wf-port.target{border-color:var(--cyan);background:var(--cyan);transform:scale(1.35)}
.br-head,.br-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center}
.br-head span{font-size:12px;color:var(--ink-3)}
.br-row .input{padding:6px 8px}
.wf-props .field:has(.br-row){gap:6px}

.wf-world.far .wf-node-h b{font-size:20px;line-height:1.08;white-space:normal;max-width:178px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wf-world.far .wf-node-h .cat-label{display:none}
.wf-world.far .wf-node-b{font-size:0}
.wf-world.far .wf-node-b::after{content:attr(data-cat);font-size:15px;font-weight:600;color:var(--ci)}
.wf-world.far .wf-node-s .nid{display:none}
.wf-world.far .wf-status{font-size:15px}
.wf-world.far .wf-status svg{width:16px;height:16px}
.wf-world.far .wf-node-r{font-size:15px}
.wf-world.far .elabel{transform:scale(1.3)}
.wf-world.far .edel{transform:scale(1.4)}
.wf-world.far .wf-edges path.e{stroke-width:3}
.wf-world.far .wf-edges path.hit{stroke-width:22}


/* ---------- Workflow configuration panel ---------- */
.wf{grid-template-columns:232px minmax(0,1fr) 380px}
.wf.props-closed{grid-template-columns:232px minmax(0,1fr) 0}
.wf-props .dz-sec h3{margin-bottom:12px}
.wf-props .kv dd{min-width:0;overflow-wrap:anywhere}
#wfSumVal{text-align:right;color:var(--ink-2)}

.proto{display:flex;gap:8px;align-items:flex-start;margin:12px 14px 0;padding:8px 10px;border-radius:8px;background:var(--cyan-soft);color:var(--cyan-strong);font-size:12.5px;line-height:1.4}

textarea.input.code{font-size:11.5px;line-height:1.5;white-space:pre;overflow:auto;tab-size:2;min-height:120px}
.lrow{display:grid;gap:6px;align-items:center}
.lrow.two{grid-template-columns:minmax(0,1fr) 30px}
.lrow.three{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 30px}
.lrow .input,.br-row .input,.map-row .input{padding:6px 8px;font-size:12.5px}
.lrow .input.mono,.map-row .input.mono,.br-row .input.mono{font-size:11.5px}
.map-head,.map-row{display:grid;grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr);gap:5px;align-items:center}
.map-row .input.mono{font-size:11px;padding:5px 6px}
.map-sub .icon-btn{margin-left:auto;width:28px;height:28px}
.map-head span{font-size:12px;color:var(--ink-3)}
.map-row{padding:8px 0;border-bottom:1px solid var(--line)}
.map-row .arrow{color:var(--ink-3);text-align:center}
.map-sub{grid-column:1 / -1;display:flex;gap:8px;align-items:center;min-width:0}
.map-sub select{width:auto;flex:none;padding:3px 6px;font-size:12px}
.map-val{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.map-val.miss{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:3px 9px 3px 6px;font-family:var(--mono);font-size:11.5px}
.chip svg{width:12px;height:12px}
.chip:hover{border-style:solid}
.check.bad svg{color:var(--err)}
.check code,.hint code{font-family:var(--mono);font-size:11px}
.verdict{padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:4px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--err-soft);color:var(--err)}
pre.log.json{max-height:280px;overflow:auto;margin:0;font-size:11px;line-height:1.5}
.mail-prev{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
.mail-prev>div{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.mail-prev>div span{color:var(--ink-3);width:74px;flex:none}
.mail-prev>div svg{width:13px;height:13px;color:var(--ink-3)}
.mail-prev pre{margin:0;padding:10px;font-family:var(--font);font-size:12.5px;white-space:pre-wrap;background:var(--surface-2)}
.wf-return{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--pop-shadow);font-size:13px;max-width:calc(100% - 32px)}
.wf-return[hidden]{display:none}
.wf-return>svg{color:var(--cyan)}

/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .designer{grid-template-columns:220px minmax(0,1fr) 270px}

}

  .menu-btn{display:grid}

  .wf-mid{order:1;height:78vh}.wf-props{order:2;border:0;border-top:1px solid var(--line)}.wf-lib{order:3;border:0;border-top:1px solid var(--line);max-height:420px}
  .wf-test{grid-template-columns:1fr}.wf-test>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .dz-side{order:2;max-height:none}.dz-center{order:1;height:70vh}.dz-props{order:3}

  .ai-ctx{display:none}
  .stat-strip{grid-template-columns:repeat(2,1fr)}

  .modal-body{grid-template-columns:1fr}

}
@media (max-width:560px){
  .topbar{padding:0 12px;gap:6px}

  #designSwitch .sw-t{display:none}
  .wf-hint{display:none}
  .output-stats{gap:20px}
  .chat-log,.composer{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body *{visibility:hidden}
  .print-target, .print-target *{visibility:visible}
  .print-target{position:fixed!important;left:0!important;top:0!important;transform:none!important;box-shadow:none!important}
  @page{size:A4;margin:0}
}

/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('en-IE', {style:'currency', currency:'EUR'}).format(n);
const num = n => new Intl.NumberFormat('en-IE').format(n);
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
const fmtTime = d => new Date(d).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
const icons = () => window.lucide && lucide.createIcons({attrs:{'stroke-width':1.75}});
let seed = 20261109;
const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const NOW = new Date('2026-11-09T10:42:00');

function toast(msg, icon = 'circle-check') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t); icons();
  setTimeout(() => { t.style.opacity = 0; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2800);
}

   ========================================================= */

  email:'billing@halcyon-energy.cy', phone:'+357 25 820 400', web:'halcyon-energy.cy'
};

function qrSVG(text, size = 96) {
  let s = 0; for (const ch of text) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const r = () => { s = (s * 1103515245 + 12345) >>> 0; return (s >>> 16) & 1; };
  const n = 25, c = size / n; let rects = '';
  const finder = (x, y) => `<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#1A232C"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#1A232C"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n-9 && y < 8) || (x < 8 && y > n-9);
    if (!inF && r()) rects += `<rect x="${(x*c).toFixed(2)}" y="${(y*c).toFixed(2)}" width="${c.toFixed(2)}" height="${c.toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" fill="#1A232C" aria-label="QR code">${rects}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
function barcodeSVG() {
  let x = 0, bars = '';
  for (let i = 0; i < 46; i++) { const w = [1,1,2,3][Math.floor(rnd()*4)]; if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="40"/>`; x += w; }
  return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" width="100%" height="100%" fill="#1A232C">${bars}</svg>`;
}

function renderDashboard() {

  const series = {
    email: hours.map(h => Math.round((h < 6 ? 400 : h < 9 ? 3800 : h < 18 ? 6200 : 1900) * (0.75 + rnd()*0.5))),
    print: hours.map(h => Math.round((h < 1 || h > 4 ? 300 : 9000) * (0.7 + rnd()*0.5))),
    portal: hours.map(h => Math.round((h < 7 ? 900 : 2600) * (0.7 + rnd()*0.6)))
  };
  const nowH = NOW.getHours();
  const W = 720, H = 220, P = { l:44, r:10, t:10, b:24 };
  const max = 14000;
  const x = i => P.l + i * (W - P.l - P.r) / 23;
  const y = v => H - P.b - v / max * (H - P.t - P.b);
  const stack = hours.map(i => [series.print[i], series.print[i] + series.email[i], series.print[i] + series.email[i] + series.portal[i]]);
  const area = (lo, hi, col) => {
    const up = hours.filter(i => i <= nowH).map(i => `${x(i)},${y(stack[i][hi])}`);
    const dn = hours.filter(i => i <= nowH).reverse().map(i => `${x(i)},${lo < 0 ? y(0) : y(stack[i][lo])}`);
    return `<polygon points="${up.join(' ')} ${dn.join(' ')}" fill="${col}" opacity=".85"/>`;

function suggestBinding(e) {
  const l = (e.props.label || '').toLowerCase();
  if (l.includes('vat')) return { path:'customer.vatNumber', conf:96, why:'label and VAT number format' };
  if (l.includes('site')) return { path:'customer.site', conf:91, why:'label and sample values' };
  return { path:'payment.terms', conf:88, why:'position below payment reference and text length' };
}
function select(id) { D.sel = id; drawCanvas(); drawProps(); }
function deleteSel() { if (!D.sel) return; snapshot(); D.els = D.els.filter(e => e.id !== D.sel); D.sel = null; drawCanvas(); drawProps(); drawTree(); toast('Element deleted. Ctrl Z to undo.', 'trash-2'); }
function dupSel() { const e = D.els.find(x => x.id === D.sel); if (!e) return; snapshot(); const c = JSON.parse(JSON.stringify(e)); c.id = 'e' + Date.now(); c.x += 12; c.y += 12; D.els.push(c); select(c.id); }
function addElement(type, x, y, binding) {
  snapshot();
  const d = JSON.parse(JSON.stringify(DEFAULTS[type]));
  const e = { id:'e' + Date.now(), type, x:Math.round(Math.max(0, Math.min(794 - d.w, x)) / 4) * 4, y:Math.round(Math.max(0, Math.min(1123 - d.h, y)) / 4) * 4, w:d.w, h:d.h, props:d.props };
  if (binding) { e.props.binding = binding; const k = binding.split('.').pop(); e.props.label = k.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase()); }
  D.els.push(e); D.sel = e.id; drawCanvas(); drawProps(); drawTree();
  return e;
}

function wireDesigner() {
  const stage = $('#dzStage');
  document.addEventListener('dragstart', ev => {
    const n = ev.target.closest?.('[data-new],[data-field]');
    if (!n) return;
    ev.dataTransfer.setData('text/plain', n.dataset.new ? 'new:' + n.dataset.new : 'field:' + n.dataset.field);
    ev.dataTransfer.effectAllowed = 'copy';
  });
  stage.addEventListener('dragover', ev => {
    ev.preventDefault();
    const sh = $('#dzSheet'); sh && sh.classList.add('drop-hover');
    $$('.el.drop-target').forEach(x => x.classList.remove('drop-target'));
    const t = ev.target.closest('.el'); if (t) t.classList.add('drop-target');
  });
  stage.addEventListener('dragleave', ev => { if (!stage.contains(ev.relatedTarget)) { $('#dzSheet')?.classList.remove('drop-hover'); } });
  stage.addEventListener('drop', ev => {
    ev.preventDefault();
    $('#dzSheet')?.classList.remove('drop-hover');
    const d = ev.dataTransfer.getData('text/plain'); if (!d) return;
    const r = $('#dzSheet').getBoundingClientRect();
    const x = (ev.clientX - r.left) / D.zoom, y = (ev.clientY - r.top) / D.zoom;
    const onEl = ev.target.closest('.el');
    if (d.startsWith('field:') && onEl) {
      const e = D.els.find(z => z.id === onEl.dataset.id);
      if (['field','qr','barcode'].includes(e.type)) { snapshot(); e.props.binding = d.slice(6); D.sel = e.id; drawCanvas(); drawProps(); drawTree(); toast(`Bound to ${e.props.binding}`, 'link'); return; }
    }
    if (d.startsWith('new:')) addElement(d.slice(4), x - 20, y - 10);
    else if (d.startsWith('field:')) addElement('field', x - 20, y - 10, d.slice(6));
  });
  // keyboard add from palette
  $$('.pal-item').forEach(p => p.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); addElement(p.dataset.new, 300, 700); } }));

  // move & resize
  let drag = null;
  stage.addEventListener('pointerdown', ev => {
    const n = ev.target.closest('.el');
    if (!n) { if (ev.target.closest('.sheet')) { D.sel = null; drawCanvas(); drawProps(); } return; }
    const e = D.els.find(z => z.id === n.dataset.id);
    if (D.sel !== e.id) { D.sel = e.id; drawCanvas(); drawProps(); }
    const node = $(`.el[data-id="${e.id}"]`);
    drag = { e, node, sx:ev.clientX, sy:ev.clientY, ox:e.x, oy:e.y, ow:e.w, oh:e.h, resize: ev.target.classList.contains('handle'), moved:false };
    node.setPointerCapture?.(ev.pointerId);
    ev.preventDefault();
  });
  window.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = (ev.clientX - drag.sx) / D.zoom, dy = (ev.clientY - drag.sy) / D.zoom;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 2) { snapshot(); drag.moved = true; }
    if (!drag.moved) return;
    const snap = v => Math.round(v / 4) * 4;
    if (drag.resize) { drag.e.w = Math.max(8, snap(drag.ow + dx)); drag.e.h = Math.max(2, snap(drag.oh + dy)); drag.node.style.width = drag.e.w + 'px'; drag.node.style.height = drag.e.h + 'px'; }
    else { drag.e.x = Math.max(0, Math.min(794 - drag.e.w, snap(drag.ox + dx))); drag.e.y = Math.max(0, Math.min(1123 - drag.e.h, snap(drag.oy + dy))); drag.node.style.left = drag.e.x + 'px'; drag.node.style.top = drag.e.y + 'px'; }
  });
  window.addEventListener('pointerup', () => { if (drag && drag.moved) { drawCanvas(); drawProps(); } drag = null; });

  $('#dzLayers').addEventListener('click', ev => { const l = ev.target.closest('[data-layer]'); if (l) select(l.dataset.layer); });
  $('#dzUndo').onclick = undo;
  $('#dzIn').onclick = () => { D.zoom = Math.min(1.5, +(D.zoom + .1).toFixed(2)); drawCanvas(); };
  $('#dzOut').onclick = () => { D.zoom = Math.max(.4, +(D.zoom - .1).toFixed(2)); drawCanvas(); };
  $('#dzSample').onchange = ev => { D.sample = ev.target.checked; drawCanvas(); };
  $('#dzGrid').onchange = ev => { D.grid = ev.target.checked; drawCanvas(); };
  $('#dzRecord').onchange = ev => { D.dataIdx = +ev.target.value; drawCanvas(); };
  $('#dzPublish').onclick = () => {
    const unm = D.els.filter(e => e.type === 'field' && !e.props.binding).length;
    if (unm) return toast(`Map the ${unm} remaining fields before requesting approval`, 'circle-alert');
    AUDIT.unshift({ ts:new Date(), actor:PEOPLE[0], action:'Approval requested', resource:'INV-STD v14', icon:'send', detail:'Sent to Nikos Charalambous', ip:'82.116.40.12', hash:'f0' + Date.now().toString(16).slice(-8) });
    toast('Approval requested from Nikos Charalambous', 'send');
  };
  document.addEventListener('keydown', ev => {
    if ($('#view-designer').hidden) return;
    const tag = document.activeElement.tagName;
    if (['INPUT','TEXTAREA','SELECT'].includes(tag)) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'd') { ev.preventDefault(); dupSel(); return; }
    const e = D.els.find(x => x.id === D.sel); if (!e) return;
    if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); deleteSel(); }
    const step = ev.shiftKey ? 16 : 4;
    const mv = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] }[ev.key];
    if (mv) { ev.preventDefault(); snapshot(); e.x += mv[0]; e.y += mv[1]; drawCanvas(); drawProps(); }
  });
}

function gLoad(key, fallback) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; } catch (e) { return fallback; } }
function gSave(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

      <div class="table-wrap"><table class="t"><thead><tr><th>Document</th><th>Type</th><th>Customer</th><th>Issued</th><th class="num">Amount</th><th>Delivered via</th><th>Retention</th><th>Integrity</th></tr></thead><tbody id="arRows"></tbody></table></div>
    </section></div>`;
    rendered.archive = true;
    $('#arQ').oninput = e => { AR.q = e.target.value; drawArchive(); };
    $('#arType').onchange = e => { AR.type = e.target.value; drawArchive(); };
    $('#arCh').onchange = e => { AR.channel = e.target.value; drawArchive(); };
    $('#arDays').onchange = e => { AR.days = e.target.value; drawArchive(); };
    $('#arRows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) openDoc(tr.dataset.id); });
    $('#arExport').onclick = () => toast('Export of matching documents queued. You’ll get an email when it’s ready.', 'download');
    $('#arHold').onclick = () => toast('Select documents first, or narrow the search to apply a hold to all results', 'lock');
  }
  drawArchive();
}
function hl(t) { const q = AR.q.trim(); if (!q) return esc(t); const i = String(t).toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return esc(t); return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); }
function drawArchive() {
  const q = AR.q.trim().toLowerCase();
  const list = ARCHIVE.filter(d => (!AR.type || d.type === AR.type) && (!AR.channel || d.channel === AR.channel) && (NOW - d.date) / 86400000 <= +AR.days &&
    (!q || d.id.toLowerCase().includes(q) || d.customer.toLowerCase().includes(q) || (d.amount && eur(d.amount).toLowerCase().includes(q))));
  $('#arCount').textContent = `${list.length} documents match`;
  $('#arRows').innerHTML = list.length ? list.map(d => `<tr class="click" data-id="${d.id}"><td class="mono">${hl(d.id)}</td><td>${d.type}</td><td>${hl(d.customer)}</td><td style="white-space:nowrap">${fmtDate(d.date)}</td><td class="num">${d.amount ? hl(eur(d.amount)) : '<span class="muted">n/a</span>'}</td><td>${esc(d.channel)}</td><td>${d.retention}</td><td>${d.signed ? '<span class="pill ok">Sealed</span>' : '<span class="pill plain">Hashed</span>'}</td></tr>`).join('')
    : `<tr><td colspan="8"><div class="empty"><strong>No documents match “${esc(AR.q)}”</strong>Try a customer name, a document number such as INV-2026-004817, or widen the date range.</div></td></tr>`;
  icons();
}
function openDoc(id) {
  const a = ARCHIVE.find(d => d.id === id);
  const ci = Math.abs([...a.customer].reduce((s, c) => s + c.charCodeAt(0), 0)) % 3;
  const html = a.type === 'Statement' ? statementHTML(STATEMENTS[ci]) : invoiceHTML(INVOICES[ci]);
  openModal({ title:a.id, sub:`${a.type} for ${a.customer}, issued ${fmtDate(a.date)}`,
    body:`<div class="stage" style="max-height:72vh">${sheetHolder(html, .55, `${a.id} · archived copy`)}</div>
      <div class="pv-side" style="border-left:1px solid var(--line)"><div class="dz-sec"><h3>Record</h3><dl class="kv"><dt>Type</dt><dd>${a.type}</dd><dt>Customer</dt><dd>${esc(a.customer)}</dd><dt>Delivered via</dt><dd>${esc(a.channel)}</dd><dt>Size</dt><dd>${a.size}</dd><dt>Retention</dt><dd>${a.retention}</dd><dt>SHA-256</dt><dd class="mono">${a.hash}…</dd></dl></div>
      <div class="dz-sec"><h3>Integrity</h3><div class="check ok"><i data-lucide="shield-check"></i><span>Hash matches the value sealed at creation</span></div>${a.signed ? '<div class="check ok"><i data-lucide="signature"></i><span>Qualified seal valid</span></div>' : ''}<div class="check ok"><i data-lucide="lock"></i><span>Stored in WORM bucket, cannot be changed</span></div></div>
      <div class="dz-sec row"><button class="btn sm" onclick="toast('Download logged to the audit trail','download')"><i data-lucide="download"></i>Download PDF</button><button class="btn sm" onclick="toast('Re-sent to the customer by email','send')"><i data-lucide="send"></i>Re-send</button></div></div>` });
  AUDIT.unshift({ ts:new Date(), actor:PEOPLE[0], action:'Document retrieved', resource:a.id, icon:'eye', detail:'Opened from archive search', ip:'82.116.40.12', hash:'d' + Date.now().toString(16).slice(-9) });
}

    </section></div>`;
  $('#auActor').onchange = e => { AU.actor = e.target.value; drawAudit(); };

const WF = window.VersoWorkflow = {
  name:'Invoice delivery', status:'draft', version:1, saved:null,
  nodes:[],          // { id, type, x, y, title, config, status }
  edges:[],          // { id, from, fromPort, to, toPort }

  sel:null, selEdge:null, undo:[], redo:[], fitted:false,
  panel:{ open:true, tab:'test' }, run:null, issues:null, lastRun:null, record:0

function wfUid(prefix = 'n') {
  let id;
  do { id = `${prefix}_${Math.random().toString(16).slice(2, 8)}`; } while (WF.nodes.some(n => n.id === id) || WF.edges.some(e => e.id === id));
  return id;
}
function wfMakeNode(type, x, y, title, config) {
  const t = WF_TYPES[type];
  const n = { id:wfUid('n'), type, x, y, title:title || t.label, config:{ ...JSON.parse(JSON.stringify(t.config)), ...JSON.parse(JSON.stringify(config || {})) }, status:'incomplete' };
  return n;
}

/* ---------- Connection rules ---------- */
function wfReaches(fromId, targetId) { // is targetId reachable from fromId by following connections?
  const seen = new Set(), stack = [fromId];
  while (stack.length) {
    const id = stack.pop(); if (id === targetId) return true;
    if (seen.has(id)) continue; seen.add(id);
    WF.edges.forEach(e => { if (e.from === id) stack.push(e.to); });
  }
  return false;
}
function wfCanConnect(from, fromPort, to, toPort) {
  const a = WF.nodes.find(n => n.id === from), b = WF.nodes.find(n => n.id === to);
  if (!a || !b) return { ok:false, reason:'Both steps must exist.' };
  if (from === to) return { ok:false, reason:'A step can’t connect to itself.' };
  if (!WF_TYPES[b.type].ins.includes(toPort)) return { ok:false, reason:`${b.title} has no “${toPort}” input.` };
  if (WF.edges.some(e => e.from === from && e.fromPort === fromPort && e.to === to && e.toPort === toPort)) return { ok:false, reason:'These steps are already connected this way.' };
  if (wfReaches(to, from)) return { ok:false, reason:`That would create a loop back to ${a.title}. Loops aren’t supported in this prototype.` };
  return { ok:true };
}
function wfConnect(from, fromPort, to, toPort) {
  const r = wfCanConnect(from, fromPort, to, toPort);
  if (!r.ok) return r;
  wfPush();
  const e = { id:wfUid('e'), from, fromPort, to, toPort };
  WF.edges.push(e);
  return { ok:true, edge:e };
}

const wfNode = id => WF.nodes.find(n => n.id === id);
const wfType = n => WF_TYPES[n.type];
const wfIns = n => wfType(n).ins;
const wfOutDefs = n => { const o = wfType(n).outs; return (typeof o === 'function' ? o(n.config) : o).map(([id, label, optional]) => ({ id, label, optional:!!optional })); };
const wfOuts = n => wfOutDefs(n).map(p => p.id);
const wfOutLabel = (n, id) => (wfOutDefs(n).find(p => p.id === id) || {}).label || id;
const wfMissing = n => {
  const t = wfType(n);
  const m = t.fields.filter(f => f.req && !String(n.config[f.k] ?? '').trim());
  (t.check ? t.check(n.config) : []).forEach(l => m.push(F('_check', l)));
  return m;
};
function wfComputeStatus(n) {
  if (WF.run && WF.run.state[n.id]) return WF.run.state[n.id];
  if (wfMissing(n).length) return 'incomplete';
  if (wfIns(n).length && !WF.edges.some(e => e.to === n.id)) return 'incomplete';
  return 'configured';
}
function wfRefreshStatus() { WF.nodes.forEach(n => n.status = wfComputeStatus(n)); }
function wfPortY(n, dir, name) {
  const list = dir === 'in' ? wfIns(n) : wfOuts(n);
  if (list.length <= 1) return 25;
  return NODE_BASE + PORT_ROW * Math.max(0, list.indexOf(name)) + PORT_ROW / 2;
}
function wfNodeH(n) {
  const rows = Math.max(wfIns(n).length > 1 ? wfIns(n).length : 0, wfOuts(n).length > 1 ? wfOuts(n).length : 0);
  return NODE_BASE + rows * PORT_ROW + 2;
}
function wfPrune() { // remove edges whose handles no longer exist
  WF.edges = WF.edges.filter(e => { const a = wfNode(e.from), b = wfNode(e.to); return a && b && wfOuts(a).includes(e.fromPort) && wfIns(b).includes(e.toPort); });
}

const wfSnap = () => JSON.stringify({ nodes:WF.nodes, edges:WF.edges });
function wfPush() {
  WF.undo.push(wfSnap()); if (WF.undo.length > 80) WF.undo.shift(); WF.redo = [];
  if (WF.run && !WF.run.active) WF.run = null;
  wfDirty();
}
function wfRestore(str) { const o = JSON.parse(str); WF.nodes = o.nodes; WF.edges = o.edges; if (!wfNode(WF.sel)) WF.sel = null; WF.selEdge = null; wfDrawAll(); }
function wfUndo() { if (!WF.undo.length) return toast('Nothing to undo', 'undo-2'); WF.redo.push(wfSnap()); wfRestore(WF.undo.pop()); wfDirty(); }
function wfRedo() { if (!WF.redo.length) return toast('Nothing to redo', 'redo-2'); WF.undo.push(wfSnap()); wfRestore(WF.redo.pop()); wfDirty(); }
function wfDirty() {
  WF.issues = null;
  if (WF.status === 'published') { WF.status = 'draft'; WF.version++; }
  wfDrawToolbarState();
}

function wfHl(text, q) { if (!q) return esc(text); const i = text.toLowerCase().indexOf(q); return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); }
function wfDrawLib() {
  const q = ($('#wfLibQ').value || '').trim().toLowerCase();
  let html = '', total = 0;
  Object.entries(WF_CATS).forEach(([k, c]) => {
    const items = Object.entries(WF_TYPES).filter(([, t]) => t.cat === k && (!q || [t.label, t.desc, t.kw, c.name].join(' ').toLowerCase().includes(q)));
    if (!items.length) return;
    total += items.length;
    html += `<div class="wf-cat" style="--c:${c.c}"><i></i><b>${c.name}</b><span class="cnt">${items.length}</span></div>` + items.map(([id, t]) =>

  });
  $('#wfLib').innerHTML = total ? html : `<div class="empty"><strong>No steps match “${esc(q)}”</strong>Try “email”, “PDF”, “AI” or “SFTP”.</div>`;
  icons();
}

/* ---------- Canvas view ---------- */
function wfApplyView() {
  const { x, y, z } = WF.view;
  $('#wfWorld').style.transform = `translate(${x}px,${y}px) scale(${z})`;
  const c = $('#wfCanvas');
  c.style.backgroundSize = `${16 * z}px ${16 * z}px`;
  c.style.backgroundPosition = `${x}px ${y}px`;
  $('#wfZoom').textContent = Math.round(z * 100) + '%';
  $('#wfWorld').classList.toggle('far', z < .75); // larger titles and labels when zoomed out
}
function wfZoomAt(nz, cx, cy) {
  const r = $('#wfCanvas').getBoundingClientRect();
  nz = Math.max(.25, Math.min(2, nz));
  if (cx == null) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const px = cx - r.left, py = cy - r.top, V = WF.view;
  V.x = px - (px - V.x) * nz / V.z; V.y = py - (py - V.y) * nz / V.z; V.z = nz;
  wfApplyView();
}
function wfFit() {
  const c = $('#wfCanvas'); if (!c) return;
  const r = c.getBoundingClientRect(); if (!r.width) return;
  if (!WF.nodes.length) { WF.view = { x:r.width / 2 - 114, y:r.height / 2 - 50, z:1 }; return wfApplyView(); }
  const minX = Math.min(...WF.nodes.map(n => n.x)) - 80, maxX = Math.max(...WF.nodes.map(n => n.x + NODE_W)) + 80;
  const minY = Math.min(...WF.nodes.map(n => n.y)) - 10, maxY = Math.max(...WF.nodes.map(n => n.y + wfNodeH(n))) + 10;
  const pad = { l:16, r:16, t:56, b:r.width < 600 ? 16 : 52 }; // clear the status legend (top) and hint (bottom)
  const aw = r.width - pad.l - pad.r, ah = r.height - pad.t - pad.b;
  const z = Math.max(.25, Math.min(1.1, Math.min(aw / (maxX - minX), ah / (maxY - minY))));
  WF.view = { z, x:pad.l + (aw - (maxX - minX) * z) / 2 - minX * z, y:pad.t + (ah - (maxY - minY) * z) / 2 - minY * z };
  wfApplyView();
}
const wfToWorld = (cx, cy) => { const r = $('#wfCanvas').getBoundingClientRect(); return { x:(cx - r.left - WF.view.x) / WF.view.z, y:(cy - r.top - WF.view.y) / WF.view.z }; };

/* ---------- Sample-data simulation ----------
   Everything previews against the same pipeline, computed from state:
   webhook sample payload → Map fields → context used by conditions, filenames and email/archive templates. */
function wfPayload() {
  const hook = WF.nodes.find(n => n.type === 'api-webhook');
  return hook ? jsonOr(hook.config.sample, {}) : wfSamplePayload(WF.record);
}
function wfApplyMap(rows, payload) {
  const out = {};

    if (!r.from.trim() || !r.to.trim()) return;
    const v = getPath(payload, r.from.trim());
    if (v === undefined) return;
    setPath(out, r.to.trim(), (TRANSFORMS[r.transform] || TRANSFORMS['As is'])(clone(v)));
  });
  return out;
}
function wfSim() {
  const payload = wfPayload();
  const mapNode = WF.nodes.find(n => n.type === 'map');
  const mapped = mapNode ? wfApplyMap(mapNode.config.rows, payload) : {};
  const ctx = deepMerge(clone(payload), mapped);
  const files = {};
  WF.nodes.filter(n => wfType(n).cat === 'doc').forEach(n => {
    const ext = { 'generate-docx':'.docx', 'generate-email':'.html' }[n.type] || '.pdf';
    let f = safeFile(wfResolve(n.config.file || `{{invoice.number}}${ext}`, ctx).text);
    if (!/\.[a-z0-9]{2,4}$/i.test(f)) f += ext;

function wfAttachNode(n) { // nearest document step upstream, or the one chosen in settings
  if (n.config.attach && n.config.attach !== 'auto') return n.config.attach === 'none' ? null : wfNode(n.config.attach);
  const seen = new Set(), q = WF.edges.filter(e => e.to === n.id).map(e => e.from);
  while (q.length) { const id = q.shift(); if (seen.has(id)) continue; seen.add(id); const m = wfNode(id); if (m && wfType(m).cat === 'doc') return m; WF.edges.filter(e => e.to === id).forEach(e => q.push(e.from)); }
  return null;
}
function wfSwitchPick(n, ctx) {
  const value = getPath(ctx, n.config.field);
  const b = (n.config.branches || []).find(x => wfCompare(value, n.config.op, x.value));
  return { value, port:b ? b.id : n.config.other ? 'other' : null };
}

const fld = (label, inner, hint = '', req = false) => `<div class="field"><label>${esc(label)}${req ? '<span class="req">Required</span>' : ''}</label>${inner}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const inp = (k, v, o = {}) => `<input class="input ${o.mono ? 'mono' : ''} ${o.req && !String(v).trim() ? 'missing' : ''}" data-cfg="${k}" ${o.req ? 'data-req="1"' : ''} value="${esc(v)}" ${o.list ? `list="${o.list}"` : ''} placeholder="${esc(o.ph || '')}" ${o.aria ? `aria-label="${esc(o.aria)}"` : ''}>`;
const sel = (k, list, v) => `<select class="input" data-cfg="${k}">${opt(list, v)}</select>`;
const rowInp = (list, i, k, v, o = {}) => `<input class="input ${o.mono ? 'mono' : ''}" data-list="${list}" data-i="${i}" data-k="${k}" value="${esc(v)}" title="${esc(v)}" ${o.dl ? `list="${o.dl}"` : ''} placeholder="${esc(o.ph || '')}" aria-label="${esc(o.aria || k)}">`;
const rowSel = (list, i, k, options, v, aria) => `<select class="input" data-list="${list}" data-i="${i}" data-k="${k}" aria-label="${esc(aria)}">${opt(options, v)}</select>`;
const delBtn = (list, i, what) => `<button class="icon-btn" data-del-row="${list}" data-i="${i}" aria-label="Remove ${esc(what)}"><i data-lucide="x"></i></button>`;
const addBtn = (list, label) => `<button class="btn sm" data-add-row="${list}"><i data-lucide="plus"></i>${esc(label)}</button>`;
const sec = (title, body, extra = '') => `<div class="dz-sec"><h3>${title}${extra}</h3><div class="grid">${body}</div></div>`;
const chk = (ok, text, warn) => `<div class="check ${ok ? 'ok' : warn ? 'warn' : 'bad'}"><i data-lucide="${ok ? 'circle-check' : warn ? 'triangle-alert' : 'circle-x'}"></i><span>${text}</span></div>`;
const unknownNote = u => u.length ? `<div class="check warn"><i data-lucide="triangle-alert"></i><span>Not in the sample data: ${[...new Set(u)].map(x => `<code>{{${esc(x)}}}</code>`).join(', ')}</span></div>` : '';
const datalists = sim => `<datalist id="dlSrc">${leafPaths(sim.payload).map(p => `<option value="${p}">`).join('')}</datalist>
  <datalist id="dlDest">${DEST_FIELDS().map(p => `<option value="${p}">`).join('')}</datalist>
  <datalist id="dlCtx">${leafPaths(sim.ctx).map(p => `<option value="${p}">`).join('')}</datalist>`;
const proto = text => `<div class="proto"><i data-lucide="flask-conical"></i><span>${text}</span></div>`;
